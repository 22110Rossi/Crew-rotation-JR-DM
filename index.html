<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stimwell Crew Rotation</title>

<style>

.container{

}

.card{
    background:white;

    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);

    margin:10px 0;

}

button{
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.result{
    margin-top:20px;
    padding:15px;

    text-align:center;
    color:white;

            <option value="Dave">Dave</option>
        </select>

        <label>On Vessel Date</label>
        <input type="date" id="onDate">

        <input type="date" id="offDate">

        <button onclick="saveRotation()">
            Save Rotation
        </button>

        <div id="statusResult" class="result"></div>

    </div>
</div>
