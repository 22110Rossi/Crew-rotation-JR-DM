<!DOCTYPE html>
<html>
<head>
<title>StimWell Services</title>

<style>
body{
font-family:Arial;
padding:20px;
background:#f2f2f7;
}

.page{
display:none;
}

.active{
display:block;
}

button{
padding:10px;
width:100%;
margin-top:10px;
}

.home{
color:green;
font-size:40px;
font-weight:bold;
}

.away{
color:red;
font-size:40px;
font-weight:bold;
}
</style>

</head>

<body>

<div id="dashboard" class="active">

<h1>StimWell Services</h1>

<button onclick="showPage('rotation')">
Open Crew Rotation
</button>

</div>

<div id="rotation" class="page">

<h2>🚢 Crew Rotation</h2>

<select id="crew">
<option value="Jonathan">Jonathan</option>
<option value="Dave">Dave</option>
</select>

<br><br>

<input type="date" id="rotationDate">

<br><br>

<button onclick="checkRotation()">
Check Status
</button>

<div id="rotationResult"></div>

<div id="rotationInfo"></div>

<br>

<button onclick="showPage('dashboard')">
Back
</button>

</div>

<script>

function showPage(page){

document.getElementById("dashboard")
.classList.remove("active");

document.getElementById("rotation")
.classList.remove("active");

document.getElementById(page)
.classList.add("active");

}

const rotations = [

["2026-08-26","2026-09-23","Dave"],
["2026-09-23","2026-10-21","Jonathan"],
["2026-10-21","2026-11-18","Dave"],
["2026-11-18","2026-12-16","Jonathan"]

];

function checkRotation(){

const crew =
document.getElementById("crew").value;

const selected =
new Date(document.getElementById("rotationDate").value);

for(let r of rotations){

const start = new Date(r[0]);
const end = new Date(r[1]);

if(selected >= start && selected < end){

let status;

if(crew==="Jonathan"){
status = r[2]==="Dave" ? "HOME" : "AWAY";
}else{
status = r[2]==="Dave" ? "AWAY" : "HOME";
}

document.getElementById("rotationResult").innerHTML =
"<h1>"+status+"</h1>";

return;
}

}

document.getElementById("rotationResult").innerHTML =
"OUT OF RANGE";

}

</script>

</body>
</html>
