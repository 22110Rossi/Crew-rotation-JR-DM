<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crew Rotation Tracker</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f2f2f7;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    width: 90%;
    max-width: 450px;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
}

select,
input[type="date"],
button {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
    box-sizing: border-box;
}

button {
    background: #007AFF;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0063d1;
}

#result {
    text-align: center;
    font-size: 48px;
    font-weight: bold;
    margin-top: 20px;
}

.home {
    color: green;
}

.away {
    color: red;
}

.info {
    text-align: center;
    color: #666;
    margin-top: 10px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

<h1>🚢 Crew Rotation Tracker</h1>

<select id="crew">
    <option value="Jonathan">Jonathan</option>
    <option value="Dave">Dave</option>
</select>

<input type="date" id="selectedDate">

<button onclick="checkStatus()">Check Status</button>

<div id="result"></div>
<div id="info" class="info"></div>

</div>

<script>

const rotations = [

["2026-08-26","2026-09-23","Dave"],
["2026-09-23","2026-10-21","Jonathan"],
["2026-10-21","2026-11-18","Dave"],
["2026-11-18","2026-12-16","Jonathan"],
["2026-12-16","2027-01-13","Dave"],
["2027-01-13","2027-02-10","Jonathan"],
["2027-02-10","2027-03-10","Dave"],
["2027-03-10","2027-04-07","Jonathan"],
["2027-04-07","2027-05-05","Dave"],
["2027-05-05","2027-06-02","Jonathan"],
["2027-06-02","2027-06-30","Dave"],
["2027-06-30","2027-07-28","Jonathan"],
["2027-07-28","2027-08-25","Dave"],
["2027-08-25","2027-09-22","Jonathan"],
["2027-09-22","2027-10-20","Dave"],
["2027-10-20","2027-11-17","Jonathan"],
["2027-11-17","2027-12-15","Dave"],
["2027-12-15","2028-01-12","Jonathan"]

];

function checkStatus() {

    const crew = document.getElementById("crew").value;
    const dateValue = document.getElementById("selectedDate").value;

    if (!dateValue) {
        alert("Please select a date");
        return;
    }

    const selectedDate = new Date(dateValue + "T00:00:00");

    let found = false;

    for (let rotation of rotations) {

        const start = new Date(rotation[0] + "T00:00:00");
        const end = new Date(rotation[1] + "T00:00:00");

        if (selectedDate >= start && selectedDate < end) {

            let status;

            if (crew === "Jonathan") {
                status = rotation[2] === "Dave" ? "HOME" : "AWAY";
            } else {
                status = rotation[2] === "Dave" ? "AWAY" : "HOME";
            }

            const result = document.getElementById("result");

            result.innerHTML = status;
            result.className = status.toLowerCase();

            const daysLeft = Math.ceil(
                (end - selectedDate) / (1000 * 60 * 60 * 24)
            );

            document.getElementById("info").innerHTML =
                "<strong>" + crew + "</strong><br>" +
                daysLeft + " day(s) until next crew change";

            found = true;
            break;
        }
    }

    if (!found) {
        document.getElementById("result").innerHTML = "OUT OF RANGE";
        document.getElementById("result").className = "";
        document.getElementById("info").innerHTML = "";
    }
}

</script>

</body>
</html>
