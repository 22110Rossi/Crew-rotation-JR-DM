<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stimwell Services</title>

<style>
body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f5f7fa;
}

header{
    background:#003366;
    color:white;
    padding:15px;
    text-align:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:10px;
    background:#002244;
    flex-wrap:wrap;
}

nav button{
    padding:10px 15px;
    border:none;
    background:#0d6efd;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

.page{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

input,select{
    width:100%;
    padding:10px;
    margin:5px 0;
    box-sizing:border-box;
}

button.action{
    background:green;
    color:white;
    border:none;
    padding:10px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    border-radius:5px;
    cursor:pointer;
}

.status-badge{
    padding:10px;
    border-radius:5px;
    color:white;
    display:inline-block;
}

.success{
    background:green;
}

.danger{
    background:red;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
}
