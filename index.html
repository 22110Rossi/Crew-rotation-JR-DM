<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stimwell Services</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f5f7fa;
}

header {
    background: #003366;
    color: white;
    padding: 15px;
    text-align: center;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

nav {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    background: #002244;
}

nav button {
    padding: 10px 15px;
    border: none;
    background: #0d6efd;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

.page {
    display: none;
    padding: 20px;
}

.active {
    display: block;
}

.card {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

input, select {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    margin-bottom: 8px;
    box-sizing: border-box;
}

button.action {
    background: green;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
}

.status-badge {
    padding: 10px;
    border-radius: 5px;
    color: white;
    display: inline-block;
    background: green;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
}

th {
    background: #003366;
    color: white;
}
</style>
</head>

<body>

<header>
    <div class="logo">🌊 Stimwell Services</div>
</header>

<nav>
    <button onclick="showPage('dashboardPage')">Dashboard</button>
    <button onclick="showPage('rotationPage')">Crew Rotation</button>
    <button onclick="showPage('schengenPage')">Schengen Tracker</button>
    <button onclick="showPage('vesselPage')">Vessel Status</button>
</nav>

<div id="dashboardPage" class="page active">
    <div class="card">
        <h2>Dashboard</h2>
        <p>Stimwell Services Crew Management</p>

        <div class="status-badge" id="vesselStatusBadge">
            Home
        </div>
    </div>
</div>

<div id="rotationPage" class="page">
    <div class="card">
        <h2>Crew Rotation</h2>

       <input type="text" id="crewName" placeholder="Crew Name">

<select id="crewStatus">
    <option value="Home">Home</option>
    <option value="Away">Away</option>
</select>

<input type="date" id="onDate">
<input type="date" id="offDate">

        <button class="action" onclick="addRotation()">
            Save Rotation
        </button>
    </div>

    <div class="card">
        <div id="rotationList"></div>
    </div>
</div>

<div id="vesselPage" class="page">
    <div class="card">
        <h2>Vessel Status</h2>

        <select id="vesselState">
            <option>At Sea</option>
            <option>In Port</option>
        </select>

        <input type="text" id="portName" placeholder="Current Port">
        <input type="text" id="jobName" placeholder="Current Job">

        <button class="action" onclick="saveVesselStatus()">
            Update Status
        </button>
    </div>

    <div class="card">
        <div id="vesselDisplay"></div>
    </div>
</div>

<script>

let rotations = JSON.parse(localStorage.getItem("rotations")) || [];

function showPage(pageId) {
    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById(pageId).classList.add("active");
}

function addRotation() {

    const name = document.getElementById("crewName").value;
    const onDate = document.getElementById("onDate").value;
    const offDate = document.getElementById("offDate").value;

    if (!name || !onDate || !offDate) {
        return;
    }

    rotations.push({
        name: name,
        onDate: onDate,
        offDate: offDate
    });

    localStorage.setItem(
        "rotations",
        JSON.stringify(rotations)
    );

    renderRotations();
}

function renderRotations() {

    let html = `
    <table>
        <tr>
            <th>Name</th>
            <th>On</th>
            <th>Off</th>
        </tr>
    `;

    rotations.forEach(r => {
        html += `
        <tr>
            <td>${r.name}</td>
            <td>${r.onDate}</td>
            <td>${r.offDate}</td>
        </tr>
        `;
    });

    html += "</table>";

    document.getElementById("rotationList").innerHTML = html;
}

function saveVesselStatus() {

    const status = document.getElementById("vesselState").value;
    const port = document.getElementById("portName").value;
    const job = document.getElementById("jobName").value;

    localStorage.setItem("vesselStatus", status);
    localStorage.setItem("vesselPort", port);
    localStorage.setItem("vesselJob", job);

    renderVesselStatus();
}

function renderVesselStatus() {

    const status = localStorage.getItem("vesselStatus") || "";
    const port = localStorage.getItem("vesselPort") || "";
    const job = localStorage.getItem("vesselJob") || "";

    document.getElementById("vesselDisplay").innerHTML = `
        <h3>Current Vessel Status</h3>
        <p><strong>Status:</strong> ${status}</p>
        <p><strong>Port:</strong> ${port}</p>
        <p><strong>Job:</strong> ${job}</p>
    `;

    if(status){
        document.getElementById("vesselStatusBadge").textContent = status;
    }
}

renderRotations();
renderVesselStatus();

</script>

</body>
</html>
