<!DOCTYPE html>
<html>
<head>
<title>Stimwell Services</title>
<style>
body{font-family:Arial;margin:0}
nav{background:#003366;padding:10px}
button{padding:10px;margin:5px}
.page{display:none;padding:20px}
.active{display:block}
</style>
</head>
<body>

<nav>
<button onclick="showPage('home')">Dashboard</button>
<button onclick="showPage('crew')">Crew Rotation</button>
<button onclick="showPage('schengen')">Schengen</button>
<button onclick="showPage('vessel')">Vessel</button>
</nav>

<div id="home" class="page active">
<h2>Dashboard</h2>
<p>Working</p>
</div>

<div id="crew" class="page">
<h2>Crew Rotation</h2>
<p>Working</p>
</div>

<div id="schengen" class="page">
<h2>Schengen Tracker</h2>
<p>Working</p>
</div>

<div id="vessel" class="page">
<h2>Vessel Status</h2>
<p>Working</p>
</div>

<script>
function showPage(id){
document.querySelectorAll('.page').forEach(p=>{
p.classList.remove('active');
});
document.getElementById(id).classList.add('active');
}
</script>

</body>
</html>
